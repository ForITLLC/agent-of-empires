name: PR Template Check

on:
  # Use pull_request_target to have write access for PRs from forks
  # This is safe because we only read PR metadata from the event payload
  # and don't checkout or execute any code from the fork
  pull_request_target:
    types: [opened, edited]

jobs:
  check-template:
    # Key the skip on the PR author, not github.actor. The actor is whoever
    # triggered the event; on an `edited` event fired by a maintainer or
    # another bot the actor is the editor, so a github.actor guard would let
    # the check run against Dependabot's templateless body. Matches the
    # close-stale job, which keys on the same field.
    if: github.event_name == 'pull_request_target' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Check PR body for required checklist
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const body = context.payload.pull_request.body || '';

            // Check that the three required template sections are all
            // present. This catches wholesale template stripping without
            // depending on a single literal checklist line that may be
            // renamed or removed when the template is updated. The
            // previous check looked for "I understand the code I am
            // submitting", which was removed from the template in
            // #1421 but left in this workflow, so every subsequent PR
            // was flagged.
            const hasAllTemplateSections =
              body.includes('## Checklist') &&
              body.includes('## Test Coverage Analysis') &&
              body.includes('## AI Usage');

            // Escape hatches for trusted internal automation, whose body
            // is not the contributor template: the nix-npm-hash bot
            // (`.github/workflows/nix-npm-hash.yml`) and the weekly
            // release-staging PR (`.github/workflows/open-release-pr.yml`).
            //
            // Both open their PR with `secrets.RELEASE_TOKEN`, so the
            // author is the token owner, not github-actions[bot]. Key on
            // the head branch, as `tag-release-pr.yml` does: creating a
            // branch in the base repo needs push access, so a fork cannot
            // opt out of enforcement by pasting a marker into its body.
            const head = context.payload.pull_request.head;
            const isInternalRepo =
              head?.repo?.full_name === `${context.repo.owner}/${context.repo.repo}`;
            const headRef = head?.ref || '';

            const isNixNpmHashBotPr =
              isInternalRepo &&
              headRef === 'chore/nix-npm-hash-update' &&
              body.includes('<!-- nix-npm-hash:') &&
              body.includes('## Checklist');

            const isReleaseStagingBotPr =
              isInternalRepo &&
              headRef.startsWith('release-staging/v') &&
              body.includes('<!-- release-version:');

            const hasChecklist =
              hasAllTemplateSections || isNixNpmHashBotPr || isReleaseStagingBotPr;

            const prNumber = context.payload.pull_request.number;
            const labelName = 'missing-template';

            if (!hasChecklist) {
              // Check if we already labeled this PR
              const { data: labels } = await github.rest.issues.listLabelsOnIssue({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber
              });

              if (labels.some(l => l.name === labelName)) {
                console.log('PR already labeled, skipping comment');
                return;
              }

              // Ensure the label exists
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: labelName,
                  color: 'e11d21',
                  description: 'PR is missing required template checklist'
                });
              } catch (e) {
                // Label already exists, ignore
              }

              // Add label to track when this was flagged
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                labels: [labelName]
              });

              // Add comment explaining the issue
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: `⚠️ **PR Template Missing**\n\nThis PR appears to be missing the required checklist from the PR template.\n\nPlease edit your PR description to include the checklist section. The checklist helps maintainers review your contribution.\n\n**This PR will be automatically closed in 24 hours if the template is not restored.**\n\nIf you're using an AI coding tool, please ensure it preserves the PR template.`
              });

              core.setFailed('PR template checklist is missing');
            } else {
              // Template is present, remove the label if it exists
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  name: labelName
                });
                console.log('Removed missing-template label');
              } catch (e) {
                // Label wasn't present, ignore
              }

              // Clean up any warning comments left from a previous check
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber
              });

              for (const comment of comments) {
                if (comment.user.login === 'github-actions[bot]' &&
                    comment.body.includes('PR Template Missing')) {
                  await github.rest.issues.deleteComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    comment_id: comment.id
                  });
                  console.log(`Deleted warning comment ${comment.id}`);
                }
              }
            }
